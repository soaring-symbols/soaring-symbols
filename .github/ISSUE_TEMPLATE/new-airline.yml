name: "Add New Airline"
description: Request to add a brand new airline icon or logo to the Soaring Symbols library.
title: "Add: [Name of Airline] (e.g., Vietnam Airlines)"
labels: ["new airline"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Soaring Symbols library! This form is for **NEW** icons only. Please link a direct source for every asset, official if the airline publishes one.
  
  - type: input
    id: airline_name
    attributes:
      label: Full Airline Name
      description: The official name of the airline.
      placeholder: e.g., Vietnam Airlines
    validations:
      required: true

  - type: input
    id: official_website_link
    attributes:
      label: Official Airline Website Link
      description: The main URL for the airline's website. This is required for validation.
      placeholder: https://www.vietnamairlines.com/

  - type: textarea
    id: source_file_link
    attributes:
      label: Direct Link to SVG File or Brand/Press Kit Page
      description: |
        **Crucial:** Provide a direct link to the source, in this order of preference:
        1. An SVG on the airline's own website, or its **brand guideline** or **press kit** page (make sure that page offers a downloadable SVG).
        2. If the airline publishes no SVG: the logo's file page on Wikimedia Commons or Wikipedia (e.g. `https://en.wikipedia.org/wiki/File:...svg`). Not a third-party logo site.
        3. If no SVG exists anywhere: a high-quality PNG or JPG, but note that vectorization may be needed.
      placeholder: |
        https://www.airline.com/assets/logo.svg
        OR
        https://www.airline.com/about/brand-guide-download-page
        OR
        https://en.wikipedia.org/wiki/File:Airline_logo.svg
    validations:
      required: true
      
  - type: checkboxes
    id: vector_status
    attributes:
      label: Vector File Status
      options:
        - label: SVG file is **NOT** provided. (Please manually apply the **needs vectorization** label.)